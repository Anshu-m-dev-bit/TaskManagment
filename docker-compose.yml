services:
  app:
    build:
      context: .

    ports:
      - "8080:8080"

    env_file:
      - .env


  postgres:
    image: postgres:15

    environment:
       POSTGRES_DB: task_manager
       POSTGRES_USER: ${POSTGRES_USERNAME}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

volumes:
  postgres-data: